<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Play Now</title>
<style>
  :root { --bg1:#050b1f; --bg2:#0b1b4a; --blue:#1e6fff; --blue-hi:#4d94ff; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; min-height: 100dvh; background: var(--bg1); overflow: hidden; -webkit-tap-highlight-color: transparent; }
  body {
    display: grid; place-items: center;
    background: radial-gradient(120% 90% at 50% 110%, var(--bg2), var(--bg1) 70%);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  .ring {
    position: absolute; width: 20vmin; height: 20vmin; border-radius: 50%;
    border: 2px solid rgba(77,148,255,.45);
    animation: pulse 4s ease-out infinite; pointer-events: none;
  }
  .ring:nth-of-type(2) { animation-delay: 1.3s; }
  .ring:nth-of-type(3) { animation-delay: 2.6s; }
  @keyframes pulse { from { transform: scale(.6); opacity: 1; } to { transform: scale(4); opacity: 0; } }
  #play {
    position: relative; z-index: 2; cursor: pointer;
    min-height: 56px; min-width: 180px; padding: clamp(.9rem, 2.5vmin, 1.3rem) clamp(2rem, 8vmin, 3.5rem);
    border: 0; border-radius: 999px; touch-action: manipulation; -webkit-appearance: none; appearance: none;
    font-family: inherit; font-weight: 700; font-size: clamp(1.15rem, 4vmin, 1.6rem); line-height: 1;
    letter-spacing: .02em; color: #fff;
    background: linear-gradient(180deg, var(--blue-hi), var(--blue));
    box-shadow: 0 0 0 0 rgba(30,111,255,.6), 0 10px 40px rgba(30,111,255,.5);
    transition: transform .15s ease, box-shadow .15s ease;
    animation: glow 2s ease-in-out infinite;
  }
  @media (hover: hover) { #play:hover { transform: scale(1.06); } }
  #play:active { transform: scale(.96); }
  #play:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
  @keyframes glow { 50% { box-shadow: 0 0 0 18px rgba(30,111,255,0), 0 10px 60px rgba(77,148,255,.8); } }
  @media (prefers-reduced-motion: reduce) { .ring, #play { animation: none; } }
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<span class="ring"></span><span class="ring"></span><span class="ring"></span>
<button id="play" type="button">Play Now</button>
<script>
  const c = document.getElementById('bg'), x = c.getContext('2d');
  let w, h, dots = [];
  function size() {
    const r = Math.min(devicePixelRatio || 1, 2);
    w = innerWidth; h = innerHeight;
    c.width = w * r; c.height = h * r; x.setTransform(r, 0, 0, r, 0, 0);
    dots = Array.from({ length: Math.min(90, Math.floor(w * h / 14000)) }, () => ({
      x: Math.random() * w, y: Math.random() * h,
      vx: (Math.random() - .5) * .5, vy: (Math.random() - .5) * .5,
      r: Math.random() * 2 + 1
    }));
  }
  addEventListener('resize', size); size();
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function draw() {
    x.clearRect(0, 0, w, h);
    for (const d of dots) {
      if (!still) { d.x += d.vx; d.y += d.vy; }
      if (d.x < 0 || d.x > w) d.vx *= -1;
      if (d.y < 0 || d.y > h) d.vy *= -1;
      x.beginPath(); x.arc(d.x, d.y, d.r, 0, 6.283);
      x.fillStyle = 'rgba(120,170,255,.8)'; x.fill();
    }
    for (let i = 0; i < dots.length; i++) for (let j = i + 1; j < dots.length; j++) {
      const a = dots[i], b = dots[j], dist = Math.hypot(a.x - b.x, a.y - b.y);
      if (dist < 130) {
        x.strokeStyle = 'rgba(77,148,255,' + (1 - dist / 130) * .35 + ')';
        x.beginPath(); x.moveTo(a.x, a.y); x.lineTo(b.x, b.y); x.stroke();
      }
    }
    requestAnimationFrame(draw);
  }
  draw();
  document.getElementById('play').addEventListener('click', () => {
    window.open('https://plyvid.top/?p=44', '_blank', 'noopener');
  });
</script>
</body>
